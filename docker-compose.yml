# The whole of HLBuilder for running your own copy:
#
#   cp .env.hosted.example .env
#   docker compose up -d            # the published images
#   docker compose up -d --build    # built from this checkout
#
# Then open http://localhost:3000. With GOOGLE_CLIENT_ID left empty there is no
# login: the app starts as a local workspace.
services:
  postgres:
    image: postgres:17
    container_name: homelab-builder-db
    environment:
      POSTGRES_USER: ${DB_USER:-homelab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homelab_password}
      POSTGRES_DB: ${DB_NAME:-homelab_builder}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw
    networks:
      default:
        aliases:
          - postgres
          - homelab-builder-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  hlbipam:
    image: ghcr.io/butterski/homelab-builder-ipam:${HLBUILDER_TAG:-latest}
    build: ./hlbipam
    container_name: homelab-builder-ipam
    environment:
      PORT: "8081"
      TZ: ${TZ:-Europe/Berlin}
    restart: unless-stopped

  backend:
    image: ghcr.io/butterski/homelab-builder-backend:${HLBUILDER_TAG:-latest}
    build: ./backend
    container_name: homelab-builder-backend
    environment:
      SERVER_PORT: "8080"
      IPAM_URL: http://hlbipam:8081
      GIN_MODE: ${GIN_MODE:-debug}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-homelab}
      DB_PASSWORD: ${DB_PASSWORD:-homelab_password}
      DB_NAME: ${DB_NAME:-homelab_builder}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_TYPE: postgres
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-true}
      SECRETS_KEY: ${SECRETS_KEY:-}
      SECRETS_KEY_VERSION: ${SECRETS_KEY_VERSION:-1}
      ASSISTANT_ALLOW_PRIVATE_ENDPOINTS: ${ASSISTANT_ALLOW_PRIVATE_ENDPOINTS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TZ: ${TZ:-Europe/Berlin}
    extra_hosts:
      # Lets the assistant reach a model server on the Docker host (e.g. Ollama) on Linux too.
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      hlbipam:
        condition: service_started
    restart: unless-stopped

  # The web app. Its nginx also passes /api, /auth and /mcp on to the backend,
  # so this is the only port that has to be reachable.
  frontend:
    image: ghcr.io/butterski/homelab-builder-frontend:${HLBUILDER_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: homelab-builder-app
    ports:
      - ${FRONTEND_PORT:-3000}:80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
