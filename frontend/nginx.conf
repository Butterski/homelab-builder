# Keep the scheme an outer TLS proxy reports; fall back to our own.
map $http_x_forwarded_proto $hlb_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name hlbldr.com localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location = /docs {
        return 308 /docs/;
    }

    location = /docs/articles {
        return 308 /docs/articles/;
    }

    location ~ ^(/docs/(?:homelab-network-planning|homelab-hardware-sizing|self-hosted-service-planning|articles/[a-z0-9-]+))$ {
        return 308 $1/;
    }

    location = /docs/docs.css {
        try_files $uri =404;
    }

    location ^~ /docs/visuals/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /docs/ {
        try_files $uri/index.html =404;
    }

    location ^~ /shared/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(builder|admin|profile|settings|generate|checklist|donate)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # In-app assistant: chat replies stream as server-sent events.
    location /api/assistant/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # MCP endpoint for external LLM clients (personal access tokens only).
    location = /mcp {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $hlb_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # MCP clients probe these paths for OAuth. HLBuilder uses access tokens, so
    # answer 404 rather than the single-page app's index.html.
    location ^~ /.well-known/oauth- {
        return 404;
    }

    location /auth/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8080;
    }
}
